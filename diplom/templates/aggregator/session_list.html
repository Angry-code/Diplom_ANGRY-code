<h1>Расписание сеансов</h1>
<table>
  <thead>
    <tr>
      <th>Фильм</th>
      <th>Зал</th>
      <th>Начало</th>
      <th>Цена (рег/VIP)</th>
    </tr>
  </thead>
  <tbody>
    {% for session in sessions %}
      <tr>
        <td>{{ session.film.title }}</td>
        <td>{{ session.venue.name }}</td>
        <td>{{ session.starts_at|date:"d.m.Y H:i" }}</td>
        <td>{{ session.price_regular }} ₽ / {{ session.price_vip }} ₽</td>
      </tr>
    {% empty %}
      <tr><td colspan="4">Нет сеансов</td></tr>
    {% endfor %}
  </tbody>
</table>
