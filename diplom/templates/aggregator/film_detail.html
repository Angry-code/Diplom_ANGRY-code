<h1>{{ film.title }}</h1>
<p>{{ film.description }}</p>
<p>Длительность: {{ film.duration_minutes }} мин.</p>
<p>Рейтинг: {{ film.rating }}</p>

<h2>Сеансы</h2>
<ul>
  {% for session in sessions %}
  <li>
    <a href="{% url 'session_detail' session.pk %}">
      {{ session.starts_at|date:"d.m.Y H:i" }} — {{ session.venue.name }}
    </a>
  </li>
  {% empty %}
  <li>Сеансов нет</li>
  {% endfor %}
</ul>
